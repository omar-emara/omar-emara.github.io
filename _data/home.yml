# Source: _pages/about.md. Written in Markdown: [text](link) makes a link,
# and a blank line starts a new paragraph.
# I am a final year PhD student supervised by [Professor Dima Damen](https://dimadamen.github.io/contact.html), [Dr Hazel Doughty](https://hazeldoughty.github.io/) and [Dr Nan Lu](https://scholar.google.com/citations?user=KQUQlG4AAAAJ&hl=en). My research is focused on improving alignment of modalities in self supervised contrastive multimodal learning to improve video understanding downstream tasks.

intro: |
  I am a PhD researcher in Interactive AI at the University of Bristol, specialising in multimodal representation learning, with a focus on audio-visual learning and video understanding. My research investigates how self-supervised contrastive learning can improve cross-modal alignment, enabling models to learn richer and more robust representations. In particular, I am interested in addressing the challenges of partial semantic correspondence, with a broader goal of advancing multimodal learning methods that enable more effective understanding of complex mutlimodal interactions. My research has been published at CVPR. 

  Beyond my core research, I have experience in explainable AI and LLM-based systems, including applied AI research in collaboration with Allianz. I combine academic research with practical experience developing and deploying machine learning systems for a startup before starting my PhD.

